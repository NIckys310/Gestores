# Revisa (también con pruebas de interfaz en un emulador) Gestores en cada cambio: pruebas automáticas, análisis de Android (lint) y APK.
name: Pruebas de Gestores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas automáticas (gestos, IA, calculadora, alarmas…)
        run: ./gradlew :mobile:testDebugUnitTest --console=plain
      - name: Análisis de Android (lint)
        run: ./gradlew :mobile:lintDebug --console=plain
      - name: Crear el APK
        run: ./gradlew :mobile:assembleDebug --console=plain
      - name: Guardar el APK y los reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gestores
          path: |
            mobile/build/outputs/apk/debug/*.apk
            mobile/build/reports/
          if-no-files-found: ignore

  interfaz:
    # Pruebas de interfaz: un emulador de Android toca los botones de verdad
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Permitir la aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas de interfaz en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :mobile:connectedDebugAndroidTest --console=plain
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interfaz
          path: mobile/build/reports/androidTests/
          if-no-files-found: ignore
